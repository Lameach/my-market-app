spring.application.name=my-market-app

spring.r2dbc.url=r2dbc:h2:mem:///market?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

server.port=8080

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

market.cache.ttl=2m

payment.base-url=http://localhost:8081

spring.security.oauth2.client.registration.payment.provider=auth
spring.security.oauth2.client.registration.payment.client-id=storefront
spring.security.oauth2.client.registration.payment.client-secret=storefront-secret
spring.security.oauth2.client.registration.payment.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.payment.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.payment.scope=payment
spring.security.oauth2.client.provider.auth.token-uri=http://localhost:9000/oauth2/token
